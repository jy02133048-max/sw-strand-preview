<script>
var O=window.SW_P2_ORGANS; if(location.search.indexOf('debug=1')>=0) window.__SW_DEBUG=true;
O.track('ViewContent',{design_mode:'wish'});
O.track('WorkspaceViewed',{design_mode:'wish',workspace:'start'});
var IMG={}; O.materials.forEach(function(m){IMG[m.key]=O.imgFor(m.key);});
/* 牌库真数据:5 张卡(语料冠军3 + 盲测强卡2),每卡=需求/类型/承接/结构钩/串 */
/* 牌库:registry 首版 4 卡 → 结构引擎 token → stone_roles 实现串型(高亮=结构角色位,非写死) */
function realizeCard(nc,N){
  N=N||21; var entry=O._test.libEntry(nc.structure_id);
  var tokens=O._test.luckyStructureTokens(entry,N);
  var roles=nc.roles, letters=['A','B','C'];
  function pick(list,i){ return list[i%list.length]; }
  var strand=[],hi=[],fIdx=[],counts={};
  tokens.forEach(function(t,i){
    var key;
    if(t==='F'){ key=(roles.F&&roles.F[0])||(roles.A&&roles.A[0])||'jx-011'; fIdx.push(i); hi.push(i); }
    else if(t==='N'){ key='jx-011'; }
    else if(typeof t==='number'){
      var rl=roles['fixed:'+t]||roles[letters[t]]||['jx-011'];
      key=pick(rl.length?rl:['jx-011'],0);
      if(i===0||typeof tokens[i-1]!=='number'||tokens[i-1]!==t) hi.push(i);   /* 站位/半环起点=角色位 */
    } else {
      var rl2=roles[t]||['jx-011'];
      counts[t]=(counts[t]||0);
      key=pick(rl2,counts[t]); counts[t]++;
      if(i===0||tokens[i-1]!==t) hi.push(i);                                  /* 每个色块第一颗=角色位 */
    }
    strand.push([key]);
  });
  var uniq=[],seen={};
  strand.forEach(function(x){ if(!seen[x[0]]){seen[x[0]]=1; var m=O.byKey[x[0]]; uniq.push(m?m.en.toLowerCase():x[0]);} });
  return {strand:strand,hi:hi.slice(0,4),fIdx:fIdx,
    re:'≈'+N+' beads · 8mm · 15.5cm starting fit · '+uniq.slice(0,4).join(', ')};
}
var CARDS=window.SW_NEED_CARDS.map(function(nc,ix){
  /* src=registry 源数据,改尺寸重实现串型用 */
  var real=realizeCard(nc);
  return {src:nc, id:ix+1, need_id:nc.need_id, wish:nc.wish_code, sid:nc.structure_id,
    nl:'\u201c'+nc.need+'\u201d', nt:nc.nt,
    /* bridge_line_en:正典 copy pack 字段(codex 终审后灌);fail-closed=通用行 */
    a1:(nc.bridge_line_en||'THE RING JUST RESTRUNG \u2014 THIS IS '+nc.structure_name.toUpperCase()),
    rc:nc.arrow, hi:real.hi, fIdx:real.fIdx,
    nm:nc.structure_name.toUpperCase(), ny:nc.blurb.split('. ')[0]+'.',
    re:real.re, strand:real.strand};
});

var ring=document.getElementById('ring'),optrow=document.getElementById('optrow'),
    a1=document.getElementById('a1');
var shown=[0,1,2], active=0, R=129-16;

var center=document.getElementById('center'),cnm=document.getElementById('cnm'),
    cny=document.getElementById('cny'),sweepEl=document.getElementById('sweep'),
    reality=document.getElementById('reality'),receipt=document.getElementById('receipt');
var RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
var ringTimers=[];
function rt(ms,fn){ringTimers.push(setTimeout(fn,ms))}
function setRing(strand,card){
  ringTimers.forEach(clearTimeout); ringTimers=[];
  ring.querySelectorAll('.bead.mark').forEach(function(b){b.classList.remove('mark')});
  receipt.style.opacity=0; reality.style.opacity=1;
  var stage=ring.parentElement; stage.classList.add('warm');
  center.classList.remove('in'); sweepEl.classList.remove('go');
  var old=[].slice.call(ring.querySelectorAll('.bead'));
  old.forEach(function(b,i){rt(i*11,function(){b.classList.add('out');setTimeout(function(){b.remove()},200)})});
  var n=strand.length;
  var order=[]; strand.forEach(function(s,i){order.push([s,i])});
  var fset={}; (card&&card.fIdx||[]).forEach(function(i){fset[i]=1});
  order.sort(function(a,b){return (fset[a[1]]?1:0)-(fset[b[1]]?1:0)});   // 焦点=结构 F 位最后落
  order.forEach(function(pair,seq){
    var s=pair[0], i=pair[1];
    var img=document.createElement('img');
    img.className='bead'; img.dataset.idx=i; img.src=IMG[s[0]];
    /* 完成态零缝铁律(Owner 2026-08-22):珠径=弦长精确相切;外缘约束靠内缩半径,不靠削珠径 */
    var s0=Math.sin(Math.PI/n);
    var Radj=Math.min(R,129/(1+s0));
    var px=2*Radj*s0;
    img.style.width=px+'px'; img.style.height=px+'px'; img.style.margin=(-px/2)+'px';
    var a=i/n*360;
    img.style.transform='rotate('+a+'deg) translateY('+(-Radj-34)+'px) scale(.5)';
    img.style.opacity='0';
    img.dataset.radj=Radj;
    ring.appendChild(img);
    var delay=RM?10:(240+seq*55+(fset[i]?200:0));
    rt(delay,function(){
      img.style.opacity='1';
      img.style.transform='rotate('+a+'deg) translateY('+(-Radj)+'px) scale(1)';
    });
  });
  var total=RM?60:(240+order.length*55+330);
  if(!RM) rt(total,function(){ sweepEl.classList.add('go'); });
  rt(total+180,function(){
    if(card){cnm.textContent=card.nm;cny.textContent=card.ny;reality.textContent=card.re;}
    center.classList.add('in'); stage.classList.remove('warm');
    if(card&&card.hi){
      var imgs=ring.querySelectorAll('.bead');
      var byIdx={}; ring.querySelectorAll('.bead').forEach(function(el){byIdx[el.dataset.idx]=el});
      card.hi.forEach(function(ix){ if(byIdx[ix]) byIdx[ix].classList.add('mark'); });
      receipt.textContent=card.rc; receipt.style.opacity=1; reality.style.opacity=0;
      rt(total+180+2600,function(){
        card.hi.forEach(function(ix){ if(byIdx[ix]) byIdx[ix].classList.remove('mark'); });
        receipt.style.opacity=0; reality.style.opacity=1;
      });
    }
  });
}
function renderOpts(){

    var strip=uniq.slice(0,5).map(function(k){return '<img src="'+IMG[k]+'" alt="">'}).join('');
    b.innerHTML='<span class="nl">'+c.nl+'</span><span class="nt">'+c.nt+'</span><div class="strip">'+strip+'</div>';

function refreshOpts(){

(function(){
  var MM=[6,8,10,12,16], mm=8, sizes=document.getElementById('sizes'),
      wr=document.getElementById('wr'), wcm=document.getElementById('wcm'),
      bcount=document.getElementById('bcount'), bmm=document.getElementById('bmm');
  MM.forEach(function(m){
    var b=document.createElement('button'); b.className='sz'+(m===8?' on':'');
    b.innerHTML='<i style="width:'+(m*1.6)+'px;height:'+(m*1.6)+'px"></i><b>'+m+'</b>';
    b.onclick=function(){mm=m;[].slice.call(sizes.children).forEach(function(x){x.classList.toggle('on',x===b)});upd();};
    sizes.appendChild(b);
  });
  var relayT=null;
  function relayRing(){
    clearTimeout(relayT);
    relayT=setTimeout(function(){
      if(document.getElementById('wres').classList.contains('on')) return;
      var c=CARDS[active], N=O.beadCount(parseFloat(wr.value),mm);
      var real=realizeCard(c.src,N);
      setRing(real.strand,{nm:c.nm,ny:c.ny,re:'\u2248'+N+' beads \u00b7 '+mm+'mm \u00b7 '+wr.value+'cm',rc:c.rc,hi:real.hi,fIdx:real.fIdx});
    },300);
  }
  function upd(){
    var v=parseFloat(wr.value); wcm.textContent=v.toFixed(1); bmm.textContent=mm;
    bcount.textContent=O.beadCount(v,mm);   // 生产 beadCount 同款(checklist §1 已核)
  }
  wr.addEventListener('input',function(){upd();relayRing();});
  sizes.addEventListener('click',relayRing);
  upd();
  document.getElementById('sheetback').onclick=function(){document.getElementById('sheet').classList.remove('up')};
  document.getElementById('gen').onclick=function(){
    document.getElementById('sheet').classList.remove('up');
    O.track('GenerationStarted',{design_mode:'wish'});
    a1.textContent='STRINGING YOURS — THE READING FOLLOWS';
    setTimeout(showWishResult,1100);   /* 生产=真 wish 引擎应答;preview=卡对应 fixture */
  };
  function showWishResult(){
    var card=CARDS[active];
    O.track('DesignGenerated',{design_mode:'wish'});
    if(entryMode==='keep'){ return showKeepResult(card); }
    var fx=(window.SW_WISH_FIXTURES||[]).filter(function(f){return f.need_id===card.need_id})[0]
         ||(window.SW_WISH_FIXTURES||[])[0];
    if(!fx) return;
    var P=fx.public, beads=(P.bracelet_design.beads||[]).slice().sort(function(a,b){return a.index-b.index});
    document.getElementById('wmeta').textContent='SAMPLE RESULT — PRODUCTION DESIGNS FROM YOUR OWN WORDS';
    document.getElementById('wnm').textContent=(P.design_thesis&&P.design_thesis.title&&P.design_thesis.title.en)||'YOUR STRAND';
    document.getElementById('wmirror').textContent=(P.design_thesis&&P.design_thesis.mirror&&P.design_thesis.mirror.en)||'';
    var wr=document.getElementById('wring');
    [].slice.call(wr.querySelectorAll('.bead')).forEach(function(b){b.remove()});
    var n=beads.length;
    var s0=Math.sin(Math.PI/n), RR=Math.min(96,118/(1+s0)), px=2*RR*s0;   /* 零缝 */
    beads.forEach(function(bd,i){
      var img=document.createElement('img'); img.className='bead';
      img.style.width=px+'px'; img.style.height=px+'px'; img.style.margin=(-px/2)+'px';
      img.src=IMG[bd.stone&&(bd.stone.catalog_id||bd.stone.sku)]||''; img.alt=(bd.stone&&bd.stone.name)||'';
      var a2=i/n*360;
      img.style.transform='rotate('+a2+'deg) translateY('+(-RR-26)+'px) scale(.5)';
      wr.appendChild(img);
      setTimeout(function(){ img.style.opacity='1';
        img.style.transform='rotate('+a2+'deg) translateY('+(-RR)+'px) scale(1)'; },160+i*45);
    });
    /* 逐石理由:按石头分组,每石一行(count× name — role_note) */
    var groups={},order=[];
    beads.forEach(function(bd){ var k=bd.stone&&(bd.stone.catalog_id||bd.stone.sku); if(!k)return;
      if(!groups[k]){groups[k]={n:0,name:bd.stone.name||k,note:bd.role_note||''};order.push(k);}
      groups[k].n++; if(!groups[k].note&&bd.role_note)groups[k].note=bd.role_note; });
    document.getElementById('wstones').innerHTML=order.map(function(k){var g=groups[k];
      return '<p class="stoneline"><b>'+g.n+'× '+g.name+'</b> — '+g.note+'</p>';}).join('');
    /* 报价:同 BOM 链 */
    var wp=document.getElementById('wprice'); wp.textContent='Pricing your strand…';
    O.designBom({beads:beads.map(function(bd){return bd.stone&&(bd.stone.catalog_id||bd.stone.sku)}).filter(Boolean),
      wrist_cm:15.5,bead_mm:P.bracelet_design.bead_mm||8}).then(function(q){
      wp.innerHTML='<b>$'+q.totals.estimated_retail_usd+'</b> · <span class="vq">verified quote</span> · '+q.pricing_version;
    });
    document.getElementById('wres').classList.add('on');
    document.getElementById('wres').scrollTop=0;
  }
  function showKeepResult(card){
    /* 结构档:串=该结构按用户所选尺寸实现(Owner 2026-08-22:选了尺寸就生成那个尺寸的这串) */
    var wristV=parseFloat(document.getElementById('wr').value), N=O.beadCount(wristV,mm);
    var real=realizeCard(card.src,N);
    document.getElementById('wmeta').textContent='THIS EXACT STRAND \u2014 AT YOUR SIZE: '+N+' BEADS \u00b7 '+mm+'MM \u00b7 '+wristV+'CM';
    document.getElementById('wnm').textContent=card.nm;
    document.getElementById('wmirror').textContent=card.ny;
    var wr2=document.getElementById('wring');
    [].slice.call(wr2.querySelectorAll('.bead')).forEach(function(b){b.remove()});
    var keys=real.strand.map(function(x){return x[0]});
    var n=keys.length;
    var s0=Math.sin(Math.PI/n), RR=Math.min(96,118/(1+s0)), px=2*RR*s0;   /* 零缝 */
    keys.forEach(function(k,i){
      var img=document.createElement('img'); img.className='bead';
      img.style.width=px+'px'; img.style.height=px+'px'; img.style.margin=(-px/2)+'px';
      img.src=IMG[k]||''; var m=O.byKey[k]; img.alt=(m&&m.en)||'';
      var a2=i/n*360;
      img.style.transform='rotate('+a2+'deg) translateY('+(-RR-26)+'px) scale(.5)';
      wr2.appendChild(img);
      setTimeout(function(){ img.style.opacity='1';
        img.style.transform='rotate('+a2+'deg) translateY('+(-RR)+'px) scale(1)'; },160+i*45);
    });
    /* 按展示名合并(不同 SKU 同名不拆行) */
    var counts={},order=[];
    keys.forEach(function(k){ var m=O.byKey[k], nm=(m&&m.en)||k;
      if(!counts[nm]){counts[nm]=0;order.push(nm);} counts[nm]++; });
    var lines=order.map(function(nm){
      return '<p class="stoneline"><b>'+counts[nm]+'\u00d7 '+nm+'</b></p>'; });
    lines.push('<p class="stoneline">\u2192 '+card.rc+'</p>');
    document.getElementById('wstones').innerHTML=lines.join('');
    var wp=document.getElementById('wprice'); wp.textContent='Pricing your strand\u2026';
    O.designBom({beads:keys,wrist_cm:wristV,bead_mm:mm}).then(function(q){
      wp.innerHTML='<b>$'+q.totals.estimated_retail_usd+'</b> \u00b7 <span class="vq">verified quote</span> \u00b7 '+q.pricing_version;
    });
    document.getElementById('wres').classList.add('on');
    document.getElementById('wres').scrollTop=0;
  }
  document.getElementById('wrcta').onclick=function(){
    O.track('InitiateCheckout',{design_mode:'wish'});
    document.getElementById('wmeta').textContent='SAVED — CHECKOUT COMES NEXT (PREVIEW ENDS HERE)';
  };
  document.getElementById('wback').onclick=function(){ document.getElementById('wres').classList.remove('on'); };
})();
renderOpts(); select(0);   /* 首卡必经 select:bridge 真值+TasteRevealed 计首次(codex P1) */
</script>
